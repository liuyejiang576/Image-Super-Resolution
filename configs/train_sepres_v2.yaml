dataset:
  train_hr_dir: data/div2k/DIV2K_train_HR
  valid_hr_dir: data/div2k/DIV2K_valid_HR
  scale: 4
  hr_patch_size: 256
  augment: true
model:
  type: sepres_v2
  num_channels: 3
  num_block: 10
  num_channel: 16
  with_idt: true
  act_type: prelu
  depth_multiplier: 2.0
train:
  seed: 42
  batch_size: 24
  num_workers: 8
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0
  milestones:
  - 60
  - 85
  gamma: 0.5
  amp: true
  loss_type: mse
  log_every: 50
  max_train_steps_per_epoch: null
validation:
  batch_size: 1
  num_workers: 2
  max_images: 20
checkpoint:
  dir: results/sepres_v2_c16n10/checkpoints
  best_name: best.pt
  latest_name: latest.pt
  log_path: results/sepres_v2_c16n10/train_log.jsonl
